name: Install published native 3MF wheels
description: Exercise the same PyPI binaries used by source installations

inputs:
  python:
    description: Python executable to install and check the published wheels
    required: false
    default: python
runs:
  using: composite
  steps:
    - name: Install the pinned public releases without a source-build fallback
      shell: bash
      env:
        PYTHON_EXECUTABLE: ${{ inputs.python }}
        PIP_EXTRA_INDEX_URL: ""
        PIP_FIND_LINKS: ""
      run: |
        set -euo pipefail
        contract=scripts/fatcat_packaging_contract.py
        FATCAT_VERSION="$("$PYTHON_EXECUTABLE" "$contract" --get FATCAT_VERSION)"
        WRITER_VERSION="$("$PYTHON_EXECUTABLE" "$contract" --get FATCAT_WRITER_VERSION)"
        "$PYTHON_EXECUTABLE" -m pip install \
          --index-url https://pypi.org/simple --only-binary=:all: \
          --no-cache-dir --force-reinstall \
          "fatcat-metadata==$FATCAT_VERSION" "neroued-3mf==$WRITER_VERSION"
        "$PYTHON_EXECUTABLE" - <<'PY'
        import fatcat_metadata
        import fatcat_metadata_neroued
        import neroued_3mf
        from scripts.fatcat_packaging_contract import validate_fatcat_packaging_contract
        validate_fatcat_packaging_contract(fatcat_metadata, neroued_3mf)
        PY
