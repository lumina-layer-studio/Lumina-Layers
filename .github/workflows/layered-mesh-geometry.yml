name: Layered Mesh Geometry

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev-refactor, main]
  workflow_dispatch:

# PR runs share one group per workflow and cancel older runs; non-PR runs use a
# unique run_id in the group so a pending push/manual run is not replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-install:
    name: PyPI source install (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PIP_EXTRA_INDEX_URL: ""
      PIP_FIND_LINKS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install README runtime requirements in a fresh virtual environment
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          subprocess.run([sys.executable, '-m', 'venv', '.venv'], check=True)
          python = pathlib.Path('.venv') / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), '-m', 'pip', 'install', '--index-url',
                          'https://pypi.org/simple', '-r', 'requirements.txt'], check=True)
      - name: Install the README frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Check startup and download a real 3MF after session closure
        shell: python
        run: |
          import os, pathlib, subprocess
          python = pathlib.Path('.venv') / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), 'scripts/verify_source_install.py',
                          '--report-dir', 'source-install-report'], check=True)
      - name: Retain source-install diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-install-${{ matrix.runner }}
          path: source-install-report/
          if-no-files-found: ignore

  windows-geometry:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            core/requirements-glb-v2.txt

      - name: Install published native 3MF wheels
        uses: ./.github/actions/prepare-3mf-native-wheels

      - name: Install geometry dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Exercise layered geometry and 3MF writer contracts
        run: >-
          python -m pytest
          tests/test_layered_surface_mesh_unit.py
          tests/test_layered_surface_mesh_properties.py
          tests/test_unified_layered_meshing_integration.py
          tests/test_vector_layer_geometry_unit.py
          tests/test_vector_engine_mesh_weld_unit.py
          tests/test_bambu_3mf_writer_unit.py
          tests/test_3mf_native_dependency_unit.py
          tests/test_source_dependencies_unit.py
          tests/test_start_all_dependencies_unit.py
          tests/test_source_install_verifier_unit.py -q

  ubuntu-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for source release checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify source nightly publication rules
        run: node --test .github/scripts/source-nightly.test.cjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            core/requirements-glb-v2.txt

      - name: Install published native 3MF wheels
        uses: ./.github/actions/prepare-3mf-native-wheels

      - name: Install geometry dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Exercise production geometry and writer contracts
        run: >-
          python -m pytest
          tests/test_geos_buffer_fast_unit.py
          tests/test_vector_engine_fixes_unit.py
          tests/test_layered_surface_mesh_unit.py
          tests/test_unified_layered_meshing_integration.py
          tests/test_vector_layer_geometry_unit.py
          tests/test_vector_engine_mesh_weld_unit.py
          tests/test_bambu_3mf_writer_unit.py
          tests/test_3mf_native_dependency_unit.py
          tests/test_source_dependencies_unit.py
          tests/test_start_all_dependencies_unit.py
          tests/test_source_install_verifier_unit.py -q
