name: Native SVG release integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev-refactor, main]
    paths:
      - "native/lumina-svg-core/**"
      - "core/**"
      - "api/**"
      - "utils/bambu_3mf_writer.py"
      - "tests/fixtures/native_svg/**"
      - "tests/test_native_svg_*.py"
      - "scripts/benchmark_native_svg_analysis.py"
      - "scripts/build_native_svg_supported_fixture.py"
      - "scripts/verify_native_svg_slicer_outputs.py"
      - "docs/native-svg-fast-path-validation.md"
      - "progress/native-svg-fast-path-benchmark.json"
      - "progress/native-svg-slicer-reality.json"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "core/requirements-glb-v2.txt"
      - "scripts/build_3mf_native_wheels.py"
      - ".github/actions/prepare-3mf-native-wheels/**"
      - "api_server.py"
      - ".github/workflows/native-svg-core.yml"
  workflow_dispatch:

# PR runs share one group per workflow and cancel older runs; non-PR runs use a
# unique run_id in the group so a pending push/manual run is not replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-24.04
          - id: windows-amd64
            runner: windows-2022
          - id: macos-arm64
            runner: macos-15
          - id: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out SVG 0.3.4 compatibility tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lumina-layer-studio/lumina-svg-core
          # Test-only update separates compositor correctness from timing reports.
          # The installed runtime and its provenance remain the published 0.3.4.
          ref: 915be6133db2e74fa4b1157f719f68b88fd43af1
          path: .ci-svg-core-034
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Download and verify the published runtime wheel
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path
          from urllib.request import urlopen

          requirement, = [
              line.strip() for line in Path("requirements.txt").read_text().splitlines()
              if line.strip().startswith("lumina-svg-core==")
          ]
          subprocess.run([
              sys.executable, "-m", "pip", "download",
              "--index-url", "https://pypi.org/simple", "--only-binary=:all:",
              "--no-deps", requirement, "--dest", "wheelhouse",
          ], check=True)
          wheel, = Path("wheelhouse").glob("*.whl")
          version = wheel.name.split("-")[1]
          url = f"https://pypi.org/pypi/lumina-svg-core/{version}/json"
          with urlopen(url, timeout=60) as response:
              release = json.load(response)
          published = next(item for item in release["urls"] if item["filename"] == wheel.name)
          with wheel.open("rb") as source:
              assert hashlib.file_digest(source, "sha256").hexdigest() == published["digests"]["sha256"]
          print(f"Verified published wheel: {wheel.name}")
          PY
          python .ci-svg-core-034/tools/verify_wheel.py wheelhouse/*.whl --contents-only
      - name: Install and exercise the published runtime
        shell: bash
        run: |
          # Exercise the pinned compatibility tests with the same pytest major supported
          # by requirements-dev.txt; their nested approx assertions reject pytest 9.
          python -m pip install --force-reinstall wheelhouse/*.whl "pytest>=8,<9" "shapely>=2,<3" cmake==4.3.4
          python .ci-svg-core-034/tools/verify_wheel.py --installed
          # The vendored source is a frozen 0.3.0 snapshot, not the released runtime.
          (cd .ci-svg-core-034 && LUMINA_SVG_REPLAY_THREADS=4 python -m pytest tests -q)
          python - <<'PY'
          from pathlib import Path
          import lumina_svg_core

          assert lumina_svg_core.__version__ == "0.3.4"
          assert lumina_svg_core.__source_revision__ == "7056fc837eb993ea40134d98f306c1c8a3081958"
          assert lumina_svg_core.__source_dirty__ is False
          assert lumina_svg_core.RESULT_SCHEMA_VERSION == 4
          fixture = Path(".ci-svg-core-034/tests/fixtures/fill_rules_transforms.svg")
          result = lumina_svg_core.analyze_svg(fixture, 111.0, 0.02)
          assert result.status == "supported", result.reason_code
          assert result.raw.geometry_count > 0
          assert result.visible.geometry_count > 0
          assert result.silhouette.geometry_count == 1
          print(lumina_svg_core.__version__, result.visible.geometry_count)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumina-svg-core-${{ matrix.id }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  product-artifacts:
    name: product-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            core/requirements-glb-v2.txt
      - name: Prepare native 3MF wheelhouse
        uses: ./.github/actions/prepare-3mf-native-wheels
      - name: Install Lumina test dependencies
        run: >-
          python -m pip install
          -r requirements-dev.txt
      - name: Exercise native product workflows
        env:
          LUMINA_SVG_REPLAY_THREADS: "4"
        run: >-
          python -m pytest
          tests/test_native_svg_adapter_unit.py
          tests/test_native_svg_benchmark_contract_unit.py
          tests/test_native_svg_differential_unit.py
          tests/test_native_svg_fallback_properties.py
          tests/test_native_svg_workflow_integration.py
          tests/test_native_svg_packaging_contract_unit.py
          tests/test_vector_native_svg_selection_unit.py
          tests/test_svg_hole_compensation_unit.py
          tests/test_svg_compensation_analysis_unit.py
          tests/test_svg_compensation_transport_unit.py
          tests/test_svg_compensation_packaging_unit.py
          -q
      - name: Generate representative GLB and 3MF artifacts
        run: >-
          python scripts/verify_native_svg_slicer_outputs.py
          --generate-only
          --artifact-dir native-svg-reality
          --report native-svg-reality/generation-report.json
      - name: Record unavailable hosted-runner slicer boundary
        shell: bash
        run: |
          set +e
          python scripts/verify_native_svg_slicer_outputs.py \
            --no-auto-detect \
            --artifact-dir native-svg-reality \
            --bambu-3mf native-svg-reality/native-svg-BambuStudio.3mf \
            --orca-3mf native-svg-reality/native-svg-OrcaSlicer.3mf \
            --report native-svg-reality/hosted-runner-slicer-report.json
          reality_exit=$?
          set -e
          if [ "$reality_exit" -ne 20 ]; then
            echo "Expected reality_dependency_unavailable (20), got $reality_exit"
            exit 1
          fi
      - name: Measure the complete public VectorAnalysis path
        run: >-
          python scripts/benchmark_native_svg_analysis.py
          --large-search-root workspace=${{ github.workspace }}
          --output native-svg-reality/public-entry-benchmark.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lumina-native-svg-reality
          path: native-svg-reality/
          if-no-files-found: error
