name: Verify Workshop release chain

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - dev-refactor
      - main
    paths:
      - ".github/workflows/workshop-release-chain.yml"
      - "assets/workshop-registry/**"
      - "assets/workshop-seed/**"
      - "core/workshop/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "requirements.txt"
      - "scripts/verify_workshop_release_chain.py"
      - "tests/test_workshop_backend_runtime_integration.py"
      - "tests/test_workshop_backend_store_unit.py"
      - "tests/test_workshop_backend_supervisor_unit.py"
      - "tests/test_workshop_release_chain_unit.py"
      - "tests/workshop_backend_fixture.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-release-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify exact SDK, Registry, and official seed
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed host source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the exact frontend dependency graph
        run: pnpm --dir frontend install --frozen-lockfile --ignore-scripts

      - name: Install release-verifier dependencies
        run: >-
          python -m pip install
          "cryptography>=44.0.0,<46.0.0"
          "hypothesis>=6.0.0,<7.0.0"
          "httpx>=0.27.0,<1.0.0"
          "pillow>=10.0.0,<12.0.0"
          "pydantic>=2.10.0,<3.0.0"
          "pytest>=8.0.0,<9.0.0"

      - name: Resolve immutable public asset URLs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const value = require("./frontend/package.json");
          const url = value.dependencies?.["@lumina/workshop-sdk"];
          if (typeof url !== "string") process.exit(1);
          fs.appendFileSync(process.env.GITHUB_ENV, `SDK_URL=${url}\n`);
          NODE
          python <<'PY'
          import json
          import os
          from pathlib import Path

          lock = json.loads(
              Path("assets/workshop-seed/seed-lock.json").read_text(
                  encoding="utf-8"
              )
          )
          with Path(os.environ["GITHUB_ENV"]).open(
              "a",
              encoding="utf-8",
          ) as stream:
              stream.write(f"SEED_URL={lock['downloadUrl']}\n")
              stream.write(f"SEED_ASSET={lock['releaseAsset']}\n")
          PY

      - name: Download exact public Release assets
        shell: bash
        run: |
          set -euo pipefail
          chain_dir="${RUNNER_TEMP}/workshop-release-chain"
          mkdir -p "${chain_dir}"
          sdk_asset="${SDK_URL##*/}"
          curl --fail --location --proto '=https' --retry 3 \
            --max-time 120 --output "${chain_dir}/${sdk_asset}" \
            "${SDK_URL}"
          curl --fail --location --proto '=https' --retry 3 \
            --max-time 120 --output "${chain_dir}/${sdk_asset}.sha256" \
            "${SDK_URL}.sha256"
          curl --fail --location --proto '=https' --retry 3 \
            --max-time 120 --output "${chain_dir}/${SEED_ASSET}" \
            "${SEED_URL}"
          echo "CHAIN_DIR=${chain_dir}" >> "${GITHUB_ENV}"
          echo "SDK_ASSET=${sdk_asset}" >> "${GITHUB_ENV}"

      - name: Verify the complete release chain offline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_workshop_release_chain.py \
            --sdk-archive "${CHAIN_DIR}/${SDK_ASSET}" \
            --sdk-checksum "${CHAIN_DIR}/${SDK_ASSET}.sha256" \
            --seed-archive "${CHAIN_DIR}/${SEED_ASSET}"

      - name: Run release-chain regression tests
        run: python -m pytest tests/test_workshop_release_chain_unit.py -q

  backend-lifecycle:
    name: Workshop backend lifecycle on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed host source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install lifecycle test dependencies
        # Test tools plus the psutil and uv pins the host runtime uses.
        run: >-
          python -m pip install
          "cryptography>=44.0.0,<46.0.0"
          "hypothesis>=6.0.0,<7.0.0"
          "httpx>=0.27.0,<1.0.0"
          "pillow>=10.0.0,<12.0.0"
          "pydantic>=2.10.0,<3.0.0"
          "pytest>=8.0.0,<9.0.0"
          $(grep -E '^(psutil|uv)[=<>]' requirements.txt)

      - name: Run backend lifecycle tests with real processes
        # Windows ends a backend tree through a job object; POSIX walks the
        # process tree, which Windows runs never exercise.
        run: >-
          python -m pytest
          tests/test_workshop_backend_supervisor_unit.py
          tests/test_workshop_backend_store_unit.py
          tests/test_workshop_backend_runtime_integration.py
          -q
